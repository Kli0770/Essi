name: Build Zploy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip -q Zploy-main.zip -d zploy
          find zploy -maxdepth 3 -type f | head -100

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find zploy -name settings.gradle -o -name settings.gradle.kts | head -1)")
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zploy-APK
          path: "zploy/**/build/outputs/apk/**/*.apk"
