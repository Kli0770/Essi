name: Build Zploy APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Zploy
        run: |
          unzip -q Zploy-main.zip -d zploy
          find zploy -name gradlew -type f -exec chmod +x {} \;

      - name: Build APK
        run: |
          cd "$(dirname "$(find zploy -name gradlew -type f | head -1)")"
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zploy-APK
          path: "zploy/**/build/outputs/apk/**/*.apk"
